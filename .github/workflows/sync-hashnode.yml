name: Sync Markdown to Hashnode

on:
  push:
    branches:
      - main
    paths:
      - "hashnode/**/*.md"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish to Hashnode
        uses: james-wallis/hashnode-github-action@v2
        with:
          hashnode_token: ${{ secrets.HASHNODE_TOKEN }}
          publication_id: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          articles_directory: hashnode